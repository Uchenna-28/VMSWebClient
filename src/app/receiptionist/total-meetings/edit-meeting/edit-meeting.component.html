<form [formGroup]="editMeetingForm" (ngSubmit)="submitEdit()">
  <app-input
    label="Meeting title"
    placeholder="Meeting title"
    type="text"
    [imageSrc]="'assets/images/pen.png'"
    width="100%"
    height="20px"
    margin="0 0 10px 0"
    fontFamily="Helvetica Neue LT Com"
    formControlName="title"
  ></app-input>

  <app-textarea
    [placeholder]="'Type your message...'"
    [width]="'100%'"
    [height]="'40px'"
    [fontSize]="'16px'"
    [borderRadius]="'8px'"
    [backgroundColor]="'#f9f9f9'"
    [color]="'#333'"
    margin="0 0 10px 0"
    fontFamily="Helvetica Neue LT Com"
    [imageSrc]="'assets/images/list.png'"
  ></app-textarea>
  <app-date-time-input
    placeholder="Start date"
    type="date"
    width="100%"
    height="20px"
    margin="0 0 10px 0"
    fontFamily="Helvetica Neue LT Com"
    [imageSrc]="'assets/images/calendar.png'"
    formControlName="startDate"
  />

  <div class="time-div">
    <app-date-time-input
      placeholder="Time"
      type="time"
      width="100%"
      height="20px"
      margin="0 0 10px 0"
      fontFamily="Helvetica Neue LT Com"
      [imageSrc]="'assets/images/clock.png'"
      formControlName="startTime"
    />
    <app-date-time-input
      placeholder="Time"
      type="time"
      width="100%"
      height="20px"
      margin="0 0 10px 0"
      fontFamily="Helvetica Neue LT Com"
      [imageSrc]="'assets/images/clock.png'"
      formControlName="endTime"
    />
  </div>
  <app-select
    placeholder="Select meeting room"
    [options]="meetingRoomsOptions"
    [imageSrc]="'assets/images/meeting room.png'"
    width="100%"
    height="40px"
    margin="0 0 10px 0"
    fontFamily="Helvetica Neue LT Com"
    formControlName="meetingRoom"
  >
  </app-select>

  <app-input
    label="Enter participants name or email"
    placeholder="Enter participants name or email"
    type="text"
    [imageSrc]="'assets/images/participants.png'"
    width="100%"
    height="20px"
    margin="0 0 10px 0"
    fontFamily="Helvetica Neue LT Com"
    formControlName="participants"
  ></app-input>
  <app-meeting-button
    label="Save"
    backgroundColor="#AB0E1E"
    color="#ffffff"
    width="100%"
    fontFamily="Helvetica Neue LT Com"
    fontSize="16px"
    fontWeight="400"
    borderRadius="8px"
    type="submit"
  >
  </app-meeting-button>
</form>
