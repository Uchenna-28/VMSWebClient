<div class="table-controls">
    <app-search-input
    [imageSrc]="'assets/images/search.png'"
    [placeholder]="'Search '"
    (search)="handleSearch($event)"
  >
  </app-search-input> 
  <div class="table-buttons">
    <app-meeting-button
      label="Filter"
      [imageSrc]="'assets/images/Filter.png'"
      backgroundColor="#FFFFFF"
      hoverBackgroundColor="#e8e8e8"
      color="#000000"
      width="118px"
      border="2px solid #E8E8E8"
      fontSize="16px"
      fontWeight="400"
      borderRadius="8px"
      type="button"
      (buttonClick)="openFilterModal()"
    >
    </app-meeting-button>
  </div> 
</div>

<app-table
  [columns]="columns"
  [rows]="tableData"
  [enableCheckbox]="true"
  (rowAction)="onRowAction($event)"
>
</app-table>
<app-modal
  [title]="'Edit Meeting Details'"
  [isVisible]="isEditModalOpen"
  [width]="'1000px'"
  [height]="'500px'"
  [position]="'top'"
  (close)="closeEditModal()"
>
  <app-edit-meeting
    [selectedMeeting]="selectedMeeting"
    (meetingUpdated)="updateMeeting($event)"
    (closeEdit)="closeEditModal()"
  ></app-edit-meeting>
</app-modal>

<!-- View Meeting Modal -->
<app-modal
  [title]="'Meeting Details'"
  [isVisible]="isViewModalOpen"
  [width]="'1000px'"
  [height]="'500px'"
  [position]="'top'"
  (close)="isViewModalOpen = false"
>
  <app-view-meeting-details
    [selectedRow]="selectedMeeting"
    (closeModal)="isViewModalOpen = false"
    (editMeeting)="editMeetingFromView($event)"
    (deleteMeeting)="openDeleteModal($event)"
  ></app-view-meeting-details>
</app-modal>

<!-- Delete Confirmation Modal (Small) -->
<app-modal
  [title]="'Cancel'"
  [isVisible]="isDeleteModalOpen"
  [width]="'380px'"
  [height]="'200px'"
  [position]="'center'"
  (close)="closeDeleteModal()"
>
  <p class="cancel-text">Are you sure you want to cancel this meeting?</p>
    <app-meeting-button
      label="Delete"
      backgroundColor="#AB0E1E"
      hoverBackgroundColor="#8d0c18"
      color="#ffffff"
      width="100%"
      (buttonClick)="confirmDelete()"
    ></app-meeting-button>
</app-modal>

  <!-- Filter Modal -->
  <app-modal
    [title]="'Filter Meetings'"
    [isVisible]="isFilterModalOpen"
    [width]="'1000px'"
    [height]="'500px'"
    [position]="'top'"
    (close)="closeFilterModal()"
  >
    <app-filter-form
      (applyFilters)="applyFilters($event)"
      (resetFilters)="resetFilters()"
    ></app-filter-form>
  </app-modal>
