<form [formGroup]="filterForm">
  <app-date-time-input
      placeholder="Start date"
      type="date"
      width="100%"
      height="20px"
      margin="0 0 10px 0"
      [imageSrc]="'assets/svgimages/calendar.svg'"
      formControlName="startDate"
    />
    <app-date-time-input
    placeholder="Time"
    type="time"
    width="100%"
    height="20px"
    margin="0 0 10px 0"
    [imageSrc]="'assets/svgimages/clock.svg'"
    formControlName="startTime"
  />
  <app-date-time-input
        placeholder="Time"
        type="time"
        width="100%"
        height="20px"
        margin="0 0 10px 0"
        [imageSrc]="'assets/svgimages/clock.svg'"
        formControlName="endTime"
      />
      <app-select
      placeholder="Select meeting room"
      [options]="meetingRoomsOptions"
      [imageSrc]="'assets/svgimages/meeting room.svg'"
      width="100%"
      height="40px"
      margin="0 0 10px 0"
      formControlName="meetingRoom"
    >
    </app-select>
  
  <div class="space-bottom">
    <app-select
    placeholder="Sort by date"
    [options]="sortOptions"
    [imageSrc]="'assets/svgimages/Sort.svg'"
    width="100%"
    height="40px"
    margin="0 0 10px 0"
    formControlName="sort"
  >
  </app-select>
  </div>

  <div class="filter-buttons">
    <app-meeting-button
      label="Apply"
      backgroundColor="#AB0E1E"
      color="#ffffff"
      width="100%"
      (buttonClick)="onApply()"
    ></app-meeting-button>
  </div>
</form>
