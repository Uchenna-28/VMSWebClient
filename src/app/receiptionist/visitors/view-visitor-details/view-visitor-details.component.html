<div class="header-actions">
    <!-- Edit Button -->
    <app-meeting-button
    label="Print Badge"
    [imageSrc]="'assets/IconImages/print.png'"
    backgroundColor="#1f2e3d"
    color="#FFFFFF"
    width="128px"
    border="2px solid #E8E8E8"
    fontFamily="Helvetica Neue LT Com"
    fontSize="16px"
    fontWeight="400"
    borderRadius="8px"
    type="button"
    (buttonClick)="handlePrintBadgeFromView()"
  >
  </app-meeting-button>
    <app-meeting-button
      label="Edit"
      [imageSrc]="'assets/images/pen.png'"
      backgroundColor="#FFFFFF"
      color="#000000"
      width="110px"
      border="2px solid #E8E8E8"
      fontFamily="Helvetica Neue LT Com"
      fontSize="16px"
      fontWeight="400"
      borderRadius="8px"
      type="button"
      (buttonClick)="handleEditFromView()"
    >
    </app-meeting-button>
  
    <!-- Delete Button -->
    <app-meeting-button
      label="Delete"
      [imageSrc]="'assets/IconImages/delete.png'"
      backgroundColor="#FFFFFF"
      color="#F30824"
      width="128px"
      border="2px solid #E8E8E8"
      fontFamily="Helvetica Neue LT Com"
      fontSize="16px"
      fontWeight="400"
      borderRadius="8px"
      type="button"
      (buttonClick)="handleDeleteFromView()"
    >
    </app-meeting-button>
  </div>
  
  <!-- Meeting Details -->
  <app-view-modal [record]="selectedRow"></app-view-modal>
