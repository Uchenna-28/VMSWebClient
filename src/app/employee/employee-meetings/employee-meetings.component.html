<div class="main-content">
    <div class="table-controls">
      <app-search-input
      [imageSrc]="'assets/svgimages/search.svg'"
        [placeholder]="'Search for meetings...'"
        (search)="handleSearch($event)"
      >
      </app-search-input>
      <app-meeting-button
        label="New Meeting"
        icon="fas fa-plus"
        backgroundColor="#243444"
        hoverBackgroundColor="#243444"
        color="#ffffff"
        width="150px"
        fontSize="16px"
        fontWeight="400"
        borderRadius="8px"
        type="button"
        (buttonClick)="onButtonClick()"
      >
      </app-meeting-button>
    </div>
    <div class="main-control">
      <div class="header">
        <span>Past Meetings</span>
        <button>View All</button>
      </div>
      <div class="meetings-list" #meetingsList>
        <app-meeting-card
          *ngFor="let meeting of meetings"
          [meeting]="meeting"
        ></app-meeting-card>
      </div>
    </div>
    <div class="main-control">
      <div class="header">
        <span>Upcoming Meetings</span>
        <app-meeting-button
          label="View All"
          backgroundColor="#FFFFFF"
          hoverBackgroundColor="#ffffff"
          color="#000000"
          width="58px"
          height="28px"
          border="1px solid #E8E8E8"
            fontSize="12px"
          fontWeight="400"
          borderRadius="8px"
          type="button"
          (buttonClick)="navigateToHomeTab('Upcoming Meetings')"
        >
        </app-meeting-button>
      </div>
      <div #meetingsList class="upcoming-meeting">
        <app-upcoming-meeting-card
          *ngFor="let meeting of upcomingmeetings"
          [meeting]="meeting"
        ></app-upcoming-meeting-card>
      </div>
    </div>
  </div>

  <app-modal
  [title]="'Schedule a Meeting'"
  [isVisible]="isAddMeetingModalOpen"
  [width]="'1000px'"
  [height]="'500px'"
  [position]="'top'"
  (close)="closeAddMeetingModal()"
>
  <form [formGroup]="scheduleMeetingForm" (ngSubmit)="submitMeeting()">
    <app-input
      label="Meeting title"
      placeholder="Meeting title"
      type="text"
      [imageSrc]="'assets/svgimages/pen.svg'"
      width="100%"
      height="20px"
      margin="0 0 10px 0"
      formControlName="title"
    ></app-input>

    <app-textarea
      [placeholder]="'Type your message...'"
      [width]="'100%'"
      [height]="'40px'"
      [fontSize]="'16px'"
      [borderRadius]="'8px'"
      [backgroundColor]="'#ffffff'"
      [color]="'#333'"
      margin="0 0 10px 0"
      [imageSrc]="'assets/svgimages/list.svg'"
    ></app-textarea>
    <app-date-time-input
      placeholder="Start date"
      type="date"
      width="100%"
      height="20px"
      margin="0 0 10px 0"
      [imageSrc]="'assets/svgimages/calendar.svg'"
      formControlName="startDate"
    />

    <div class="time-div">
      <app-date-time-input
        placeholder="Time"
        type="time"
        width="100%"
        height="20px"
        margin="0 0 10px 0"
        [imageSrc]="'assets/svgimages/clock.svg'"
        formControlName="startTime"
      />
      <app-date-time-input
        placeholder="Time"
        type="time"
        width="100%"
        height="20px"
        margin="0 0 10px 0"
        [imageSrc]="'assets/svgimages/clock.svg'"
        formControlName="endTime"
      />
    </div>
    <app-select
      placeholder="Select meeting room"
      [options]="meetingRoomsOptions"
      [imageSrc]="'assets/svgimages/meeting room.svg'"
      width="100%"
      height="40px"
      margin="0 0 10px 0"
      formControlName="meetingRoom"
    >
    </app-select>

   <div class="space-bottom">
    <app-input
    label="Enter participants name or email"
    placeholder="Enter participants name or email"
    type="text"
    [imageSrc]="'assets/svgimages/participants.svg'"
    width="100%"
    height="20px"
    margin="0 0 10px 0"
    formControlName="participants"
  ></app-input>
   </div>

    <app-meeting-button
      label="Preview"
      icon="fas fa-eye"
      backgroundColor="#AB0E1E"
      color="#ffffff"
      width="100%"
      fontSize="16px"
      fontWeight="400"
      borderRadius="8px"
      type="submit"
    ></app-meeting-button>
  </form>
</app-modal>
