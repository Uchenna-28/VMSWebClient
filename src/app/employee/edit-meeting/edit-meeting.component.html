<form [formGroup]="editMeetingForm" (ngSubmit)="submitEdit()">
  <app-input
  label="Meeting title"
  placeholder="Meeting title"
  type="text"
  [imageSrc]="'assets/svgimages/pen.svg'"
  width="100%"
  height="20px"
  margin="0 0 10px 0"
  formControlName="title"
></app-input>

<app-textarea
  [placeholder]="'Type your message...'"
  [width]="'100%'"
  [height]="'40px'"
  [fontSize]="'16px'"
  [borderRadius]="'8px'"
  [backgroundColor]="'#f9f9f9'"
  [color]="'#333'"
  margin="0 0 10px 0"
  [imageSrc]="'assets/svgimages/list.svg'"
></app-textarea>
<app-date-time-input
  placeholder="Start date"
  type="date"
  width="100%"
  height="20px"
  margin="0 0 10px 0"
  [imageSrc]="'assets/svgimages/calendar.svg'"
  formControlName="startDate"
/>

<div class="time-div">
  <app-date-time-input
    placeholder="Time"
    type="time"
    width="100%"
    height="20px"
    margin="0 0 10px 0"
      [imageSrc]="'assets/svgimages/clock.svg'"
    formControlName="startTime"
  />
  <app-date-time-input
    placeholder="Time"
    type="time"
    width="100%"
    height="20px"
    margin="0 0 10px 0"
      [imageSrc]="'assets/svgimages/clock.svg'"
    formControlName="endTime"
  />
</div>
<app-select
  placeholder="Select meeting room"
  [options]="meetingRoomsOptions"
  [imageSrc]="'assets/svgimages/meeting room.svg'"
  width="100%"
  height="40px"
  margin="0 0 10px 0"
  formControlName="meetingRoom"
>
</app-select>

<div class="space-bottom">
  <app-input
  label="Enter participants name or email"
  placeholder="Enter participants name or email"
  type="text"
  [imageSrc]="'assets/svgimages/participants.svg'"
  width="100%"
  height="20px"
  margin="0 0 10px 0"
  formControlName="participants"
></app-input>
</div>

    <app-meeting-button
      label="Save Changes"
      icon="fas fa-save"
      backgroundColor="#AB0E1E"
      color="#ffffff"
      width="100%"
          fontSize="16px"
      fontWeight="400"
      borderRadius="8px"
      type="submit"
    >
    </app-meeting-button>
  </form>
