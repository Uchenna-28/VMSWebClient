<!-- Modal Overlay (Only visible if isVisible is true) -->
<div class="modal-overlay" *ngIf="isVisible"(click)="onOverlayClick($event)">
  <div class="modal-content" [style.width]="width" [style.height]="height" [ngClass]="'modal-' + position">
    
    <!-- Modal Header -->
    <div class="modal-header">
      <h2>{{ title }}</h2>
      <button class="close-btn" (click)="closeModal()">×</button>
    </div>

    <!-- Modal Body (Dynamic Content via ng-content) -->
    <div class="modal-body">
      <ng-content></ng-content>
    </div>

  </div>
</div>
