<div class="search-container">
  <app-image 
    [src]="imageSrc" 
    [width]="'15px'" 
    [height]="'15px'"
    [borderRadius]="'50%'"
    [color]="'red'"
  >
  </app-image>

  <input 
    type="text" 
    class="search-bar" 
    [placeholder]="placeholder"
    (input)="onSearch($event)"
  />
</div>
