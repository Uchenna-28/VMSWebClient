<div class="select-wrapper" [ngStyle]="{ width, margin }">
  <label *ngIf="label">{{ label }}</label>

  <div class="select-container" [ngStyle]="{ height }">
    <!-- Image beside the placeholder -->
    <app-image 
      *ngIf="imageSrc" 
      [src]="imageSrc"
      [width]="'16px'"
      [height]="'16px'"
      [borderRadius]="'5px'"
      class="select-icon"
    ></app-image>

    <select [value]="value" (change)="onSelectChange($event)">
      <option value="" disabled selected>{{ placeholder }}</option>
      <ng-container *ngFor="let option of options">
        <option [value]="isObjectOption(option) ? option.value : option">
          {{ isObjectOption(option) ? option.label : option }}
        </option>
      </ng-container>
    </select>
  </div>
</div>
