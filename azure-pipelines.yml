trigger:
  - main

parameters:
  - name: environment
    displayName: Which environment do you want to deploy to?
    type: string
    default: 'Development'
    values:
      - Development

variables:

  # App Configuration Endpoints
  DevAppConfigurationEndpoint: 'https://dev-app-config.azconfig.io'

  azureSubscription: '722dfaac-093c-4648-b497-7114f90a8c3b'
  sonarcloudProjectKey: 'andersen-vms-ff564c1816d5b69e57'
  sonarcloudHost: 'https://sonarcloud.io/'
  SonarCloudToken: $(SonarCloudToken)

  # Azure Storage Account (for artifact upload)
  storageAccountName: 'vmsdevfileserver'
  containerName: 'vmswebclient-deployemt-container'

  # Web App Names
  DevWebAppName: 'vms-dev-webclient'

  # Web App URLs
  dev-url: 'https://$(DevWebAppName).azurewebsites.net'
  poll-time: 30s

stages:
- stage: Build
  displayName: Build
  jobs:
    - job: BuildApp
      displayName: Build
      pool:
        vmImage: ubuntu-latest

      steps:
        - checkout: self
          clean: true
          fetchDepth: "0"
          displayName: Checkout

        - script: |
            git gc --prune=all && git repack -a -f -F -d
          displayName: Cleanup old history

        - task: NodeTool@0
          displayName: Install Node.js 22
          inputs:
            versionSpec: '22.x'
            checkLatest: true

        # - script: |
        #     npm install
        #   workingDirectory: $(System.DefaultWorkingDirectory)
        #   displayName: Install npm

        - script: npm ci
          displayName: Restore dependencies

        - script: npm run build -- --configuration=production
          displayName: 'Build Angular App'

        # - script: npm run test
        #   displayName: Run unit tests

        # - script: npm run integration-test
        #   displayName: Run integration tests

        - script: |
            mkdir -p $(Pipeline.Workspace)/drop
          displayName: 'Create drop folder'

        - task: ArchiveFiles@2
          displayName: 'Archive files'
          inputs:
            rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
            includeRootFolder: false
            archiveType: zip
            archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
            replaceExistingArchive: true

        - script: ls -l dist/
          displayName: 'Check Dist Directory'

        - task: PublishPipelineArtifact@1
          displayName: 'Publish Artifact to drop folder'
          inputs:
            pathToPublish: 'dist/vms-project-web'
            artifactName: 'drop'

        - script: |
            ls -l $(Build.ArtifactStagingDirectory)
          displayName: 'Verify artifact in Build'


- stage: Deploy
  displayName: Development
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq('${{parameters.environment}}', 'Development'))
  jobs:
    - deployment: DeployApp
      displayName: Deploy to Development
      environment: Development
      pool:
        vmImage: 'ubuntu-latest'
      strategy:
        runOnce:
          deploy:
            steps:
            # - task: AzureCLI@2
            #   displayName: 'Check Azure CLI Login'
            #   inputs:
            #     azureSubscription: $(azureSubscription)
            #     scriptType: 'bash'
            #     scriptLocation: 'inlineScript'
            #     inlineScript: |
            #       az account show
                  
            - task: DownloadPipelineArtifact@2
              inputs:
                artifact: 'drop'
                path: $(Pipeline.Workspace)/drop

            - script: |
                ls -l dist/vms-project-web
              displayName: 'List downloaded artifacts'

            - task: AzureWebApp@1
              displayName: Deploy to Azure App Service
              inputs:
                azureSubscription: $(azureSubscription)
                appType: webAppLinux
                appName: $(DevWebAppName)
                runtimeStack: 'NODE|22LTS'
                package: $(Pipeline.Workspace)/drop
                startUpCommand: 'node server.js'

            # - task: AzureCLI@2
            #   displayName: 'Check deployment logs'
            #   inputs:
            #     azureSubscription: $(azureSubscription)
            #     scriptType: 'bash'
            #     scriptLocation: 'inlineScript'
            #     inlineScript: |
            #       az webapp deployment list --name $(DevWebAppName) --resource-group VMS-DEV-RG --query "[0].status"

            # - task: AzureCLI@2
            #   displayName: 'Fetch App Logs'
            #   inputs:
            #     azureSubscription: $(azureSubscription)
            #     scriptType: 'bash'
            #     scriptLocation: 'inlineScript'
            #     inlineScript: |
            #       az webapp log tail --name $(DevWebAppName) --resource-group VMS-DEV-RG

            - task: CmdLine@2
              displayName: "Confirm site is up"
              inputs:
                script: |
                  sleep 60 # Increased initial sleep time

                  url="https://$(DevWebAppName).azurewebsites.net"
                  echo "Checking if app is up at: $url"

                  for i in {1..5}; do
                    response=$(curl -s -o /dev/null -w "%{http_code}" "$url" -k) #Added -k to ignore certificate issues.
                    if [ "$response" == "200" ]; then
                      echo "✅ App is up and running!"
                      exit 0
                    fi

                    echo "⏳ Attempt $i: App not yet available (HTTP $response), retrying in 10s..."
                    sleep 15
                  done

                  echo "❌ Deployment failed, app is not responding!"
                  exit 1
                failOnStderr: true

- stage: Cleanup
  displayName: "Cleanup"
  jobs:
  - job: CleanupJob
    displayName: "Cleanup Resources"
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - script: |
        echo "Cleaning up workspace..."
        rm -rf $(Pipeline.Workspace)
      displayName: "Cleanup Build Artifacts"