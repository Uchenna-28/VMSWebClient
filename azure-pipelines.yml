trigger:
  - main

parameters:
  - name: environment
    displayName: Which environment do you want to deploy to?
    type: string
    default: 'Development'
    values:
      - Development
      - Staging
      - Production

variables:

  # App Configuration Endpoints
  DevAppConfigurationEndpoint: 'https://dev-app-config.azconfig.io'
  StagingAppConfigurationEndpoint: 'https://stg-app-config.azconfig.io'
  ProductionAppConfigurationEndpoint: 'https://prd-app-config.azconfig.io'

  azureSubscription: '722dfaac-093c-4648-b497-7114f90a8c3b'
  sonarcloudProjectKey: 'andersen-vms-ff564c1816d5b69e57'
  sonarcloudHost: 'https://sonarcloud.io/'
  SonarCloudToken: $(SonarCloudToken)

  # Azure Storage Account (for artifact upload)
  storageAccountName: 'vmsdevfileserver'
  containerName: 'vmswebclient-deployemt-container'

  # Web App Names
  DevWebAppName: 'vms-dev-webclient'
  StagingWebAppName: 'vms-stg-webclient'
  ProductionWebAppName: 'vms-prd-webclient'

  # Web App URLs
  dev-url: 'https://$(DevWebAppName).azurewebsites.net'
  staging-url: 'https://$(StagingWebAppName).azurewebsites.net'
  production-url: 'https://$(ProductionWebAppName).azurewebsites.net'
  poll-time: 10s

stages:
- stage: Build
  displayName: Build
  jobs:
    - job: BuildApp
      displayName: Build
      pool:
        vmImage: ubuntu-latest

      steps:
        - checkout: self
          clean: true
          fetchDepth: "0"
          displayName: Checkout

        - script: |
            git gc --prune=all && git repack -a -f -F -d
          displayName: Cleanup old history

        - task: NodeTool@0
          displayName: Install Node.js 22
          inputs:
            versionSpec: '22.x'
            checkLatest: true

        - script: |
            npm install
          workingDirectory: $(System.DefaultWorkingDirectory)
          displayName: Install npm

        - script: npm ci
          displayName: Restore dependencies

        - script: npm run build
          displayName: Build Angular app

        # - script: npm run test
        #   displayName: Run unit tests

        # - script: npm run integration-test
        #   displayName: Run integration tests

        - task: ArchiveFiles@2
          displayName: 'Archive files'
          inputs:
            rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
            includeRootFolder: false
            archiveType: zip
            archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
            replaceExistingArchive: true

        - upload: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
          artifact: drop


- stage: Deploy
  displayName: Development
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq('${{parameters.environment}}', 'Development'))
  jobs:
    - deployment: DeployApp
      displayName: Deploy to Development
      environment: Development
      pool:
        vmImage: 'ubuntu-latest'
      strategy:
        runOnce:
          deploy:
            steps:
            - checkout: self
              clean: "true"

            - task: DownloadPipelineArtifact@2
              inputs:
                artifact: 'drop'
                path: $(Pipeline.Workspace)/drop

            - script: |
                ls -l $(Pipeline.Workspace)/drop
              displayName: 'List downloaded artifacts'

            - task: AzureWebApp@1
              displayName: Deploy to Azure App Service
              inputs:
                azureSubscription: $(azureSubscription)
                appType: webAppLinux
                appName: $(DevWebAppName)
                runtimeStack: 'NODE|22LTS'
                package: $(Pipeline.Workspace)/drop/$(Build.BuildId).zip
                startUpCommand: 'npm run start'

            # - task: CmdLine@2
            #   displayName: Confirm Site is Up
            #   inputs:
            #     script: |
            #       sleep $(poll-time)
            #       curl -sSf $(dev-url) > /dev/null
            #     failOnStderr: true

            - task: CmdLine@2
              displayName: "Confirm site is up"
              inputs:
                script: |
                  sleep $(poll-time)
                  
                  url="$(dev-url)"
                  echo "Checking if app is up at: $url"

                  for i in {1..5}; do
                    response=$(curl -s -o /dev/null -w "%{http_code}" "$url")
                    
                    if [ "$response" == "200" ]; then
                      echo "✅ App is up and running!"
                      exit 0
                    fi
                    
                    echo "⏳ Attempt $i: App not yet available (HTTP $response), retrying in 10s..."
                    sleep 10
                  done

                  echo "❌ Deployment failed, app is not responding!"
                  exit 1
                failOnStderr: true

- stage: Cleanup
  displayName: "Cleanup"
  jobs:
  - job: CleanupJob
    displayName: "Cleanup Resources"
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - script: |
        echo "Cleaning up workspace..."
        rm -rf $(Pipeline.Workspace)
      displayName: "Cleanup Build Artifacts"