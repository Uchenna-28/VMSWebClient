trigger:
- main

resources:
  - repo: self

variables:
  azureSubscription: 'VMS ARM SC NRG'
  webAppName: 'vms-dev-webclient'
  vmImageName: 'ubuntu-latest'
  dev-url: https://vms-dev-webclientt.azurewebsites.net
  #staging-url: https://vms-stg-webclient.azurewebsites.net
  #prod-url: https://vms-prd-webclient.azurewebsites.net

stages:
- stage: Build
  displayName: Build Angular App
  jobs:
  - job: Build
    displayName: Build Angular App
    pool:
      vmImage: $(vmImageName)

    steps:
    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: '22.x'

    - script: npm install
      displayName: Install npm packages

    - script: npm run build --if-present
      displayName: Build Angular project

    - task: ArchiveFiles@2
      displayName: 'Archive Build Output'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/dist'
        includeRootFolder: false
        archiveType: zip
        archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
        replaceExistingArchive: true

    - publish: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
      artifact: drop
      displayName: Publish Build Artifact

- stage: Deploy_Development
  displayName: Deploy to Development
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: Deploy
    displayName: Deploy to Development
    environment: Development
    pool:
      vmImage: $(vmImageName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download Build Artifacts'
            inputs:
              artifactName: 'drop'
              downloadPath: '$(Pipeline.Workspace)/drop'

          - script: ls -R $(Pipeline.Workspace)
            displayName: 'Debug: List Pipeline Workspace'            
          
          # - task: AzureWebApp@1
          #   displayName: Deploy to Development
          #   inputs:
          #     ConnectionType: 'AzureRM'
          #     azureSubscription: $(azureSubscription)
          #     ResourceGroupName: 'development'
          #     appType: 'webApp'
          #     WebAppName: 'vms-dev-webclient'
          #     packageForLinux: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
          #     startUpCommand: 'pm2 serve /home/site/wwwroot/dist/vms-project-web --spa --no-daemon'

          - task: AzureWebApp@1
            displayName: 'Deploy to Development'
            inputs:
              azureSubscription: $(azureSubscription)
              appName: $(webAppName)
              package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
              #packageForLinux: '/home/vsts/work/1/drop/**/*.zip'
              #package: '$(System.DefaultWorkingDirectory)/**/*.zip' # string. Required. Package or folder. Default: $(System.DefaultWorkingDirectory)/**/*.zip.
              deploymentMethod: 'zipDeploy'              
              startUpCommand: 'pm2 serve /home/site/wwwroot/dist/vms-project-web --spa --no-daemon'

          - task: CmdLine@2
            displayName: Confirm Deployment
            inputs:
              script: 'curl -sSf $(dev-url) > /dev/null'
              failOnStderr: true

