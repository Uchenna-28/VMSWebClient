trigger:
  - main

parameters:
  - name: environment
    displayName: Which environment do you want to deploy to?
    type: string
    default: 'Development'
    values:
      - Development
      - Staging
      - Production

variables:
  #Kudu Configuration
  KUDU_DEPLOYMENT_PASSWORD: 'xT4raceyb5y1ml5agX19hL6DaCszfbvjlDyHDTFxDBHplK2yHhrb4aewz3pz'

  # App Configuration Endpoints
  DevAppConfigurationEndpoint: 'https://dev-app-config.azconfig.io'
  StagingAppConfigurationEndpoint: 'https://stg-app-config.azconfig.io'
  ProductionAppConfigurationEndpoint: 'https://prd-app-config.azconfig.io'

  azureSubscription: '722dfaac-093c-4648-b497-7114f90a8c3b'
  sonarcloudProjectKey: 'andersen-vms-ff564c1816d5b69e57'
  sonarcloudHost: 'https://sonarcloud.io/'
  SonarCloudToken: $(SonarCloudToken)

  # Azure Storage Account (for artifact upload)
  storageAccountName: 'vmsdevfileserver'
  containerName: 'vmsadmin-deployemt-container'

  # Web App Names
  DevWebAppName: 'vms-dev-admin'
  StagingWebAppName: 'vms-stg-admin'
  ProductionWebAppName: 'vms-prd-admin'

  # Web App URLs
  dev-url: 'https://$(DevWebAppName).azurewebsites.net'
  staging-url: 'https://$(StagingWebAppName).azurewebsites.net'
  production-url: 'https://$(ProductionWebAppName).azurewebsites.net'
  poll-time: 10s

stages:
- stage: Build
  displayName: Build
  jobs:
    - job: BuildApp
      displayName: Build
      pool:
        vmImage: ubuntu-latest

      steps:
        - checkout: self
          clean: true
          fetchDepth: "0"
          displayName: Checkout

        - script: |
            git gc --prune=all && git repack -a -f -F -d
          displayName: Cleanup old history

        - task: NodeTool@0
          displayName: Install Node.js 22
          inputs:
            versionSpec: '22.x'
            checkLatest: true

        - script: |
            npm install
          workingDirectory: $(System.DefaultWorkingDirectory)
          displayName: Install npm

        - script: npm ci
          displayName: Restore dependencies

        - script: npm run build
          displayName: Build Angular app

        # - script: npm run test
        #   displayName: Run unit tests

        # - script: npm run integration-test
        #   displayName: Run integration tests

        - task: ArchiveFiles@2
          displayName: 'Archive files'
          inputs:
            rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
            includeRootFolder: false
            archiveType: zip
            archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
            replaceExistingArchive: true

        - upload: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
          artifact: drop


- stage: Deploy
  displayName: Development
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq('${{parameters.environment}}', 'Development'))
  jobs:
    - deployment: DeployApp
      displayName: Deploy to Development
      environment: Development
      pool:
        name: 'vms-dev-deployment-node'
      strategy:
        runOnce:
          deploy:
            steps:
            - checkout: self
              clean: "true"

            - task: DownloadPipelineArtifact@2
              inputs:
                artifact: 'drop'
                path: $(Pipeline.Workspace)/drop

            - script: |
                ls -l $(Pipeline.Workspace)/drop
              displayName: 'List downloaded artifacts'

            - task: PowerShell@2
              displayName: Deploy to Azure App Service via Kudu
              inputs:
                targetType: inline
                script: |
                  $username = '$($(DevWebAppName))'
                  $password = '$(KUDU_DEPLOYMENT_PASSWORD)'
                  $base64AuthInfo = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$username`:$password"))
                  
                  $zipFilePath = "$(Pipeline.Workspace)/drop/$(Build.BuildId).zip"
                  $deployUrl = "https://$(DevWebAppName).scm.azurewebsites.net/api/zipdeploy"
                  
                  Write-Output "Deploying to: $deployUrl"
                  
                  Invoke-RestMethod -Uri $deployUrl -Method POST -Headers @{Authorization=("Basic {0}" -f $base64AuthInfo)} -InFile $zipFilePath -ContentType "application/zip"

            - task: CmdLine@2
              displayName: Confirm Site is Up
              inputs:
                script: |
                  sleep $(poll-time)
                  curl -sSf $(dev-url) > /dev/null
                failOnStderr: true

- stage: Cleanup
  displayName: "Cleanup"
  jobs:
  - job: CleanupJob
    displayName: "Cleanup Resources"
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - script: |
        echo "Cleaning up workspace..."
        rm -rf $(Pipeline.Workspace)
      displayName: "Cleanup Build Artifacts"