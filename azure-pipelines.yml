trigger:
  - main

parameters:
  - name: Environment
    displayName: Which environment do you want to deploy to?
    type: string
    default: 'Development'
    values:
      - Development
      - Staging
      - Production

variables:

  # App Configuration Endpoints
  DevAppConfigurationEndpoint: 'https://dev-app-config.azconfig.io'
  StagingAppConfigurationEndpoint: 'https://stg-app-config.azconfig.io'
  ProductionAppConfigurationEndpoint: 'https://prd-app-config.azconfig.io'

  azureSubscription: '722dfaac-093c-4648-b497-7114f90a8c3b'
  sonarcloudProjectKey: 'andersen-vms-ff564c1816d5b69e57'
  sonarcloudHost: 'https://sonarcloud.io/'
  SonarToken: $(SonarCloudToken)

  # Azure Storage Account (for artifact upload)
  storageAccountName: 'vmsdevfileserver'
  containerName: 'vmswebclient-deployemt-container'

  # Web App Names
  DevWebAppName: 'vms-dev-webclient'
  StagingWebAppName: 'vms-stg-webclient'
  ProductionWebAppName: 'vms-prd-webclient'

  # Web App URLs
  dev-url: 'https://$(DevWebAppName).azurewebsites.net'
  staging-url: 'https://$(StagingWebAppName).azurewebsites.net'
  production-url: 'https://$(ProductionWebAppName).azurewebsites.net'
  poll-time: 10s

stages:
- stage: Build
  displayName: Build & Analyze
  jobs:
    - job: BuildAndAnalyze
      displayName: Build, Test, and Analyze
      pool:
        vmImage: ubuntu-latest
      steps:
        - checkout: self
          clean: true

        - task: NodeTool@0
          displayName: Install Node.js 22
          inputs:
            versionSpec: '22.x'

        - script: npm ci
          displayName: Restore dependencies

        - script: npm run build -- --configuration=production
          displayName: Build Angular app

        - script: npm run test -- --watch=false --browsers=ChromeHeadless
          displayName: Run unit tests

        - script: npm run integration-test
          displayName: Run integration tests

        - script: npm run generate-swagger
          displayName: Generate API Documentation (Swagger)

        - task: SonarCloudPrepare@3
          displayName: Prepare SonarCloud Analysis
          inputs:
            SonarQube: 'VMS SonarQube'
            organization: 'andersen-vms'
            scannerMode: 'cli'
            configMode: 'manual'
            cliProjectKey: '$(sonarcloudProjectKey)'
            cliSources: '.'
            cliOptions: >
              -Dsonar.host.url=$(sonarcloudHost)
              -Dsonar.token=$(SonarToken)

        - task: SonarCloudAnalyze@3
          displayName: Run SonarCloud Analysis
          inputs:
            jdkversion: 'JAVA_HOME_21_X64'

        - task: SonarCloudPublish@3
          displayName: Publish SonarCloud Results
          inputs:
            pollingTimeoutSec: '300'

        - task: ArchiveFiles@2
          displayName: Archive Build Artifacts
          inputs:
            rootFolderOrFile: 'dist'
            includeRootFolder: false
            archiveType: 'zip'
            archiveFile: '$(Build.ArtifactStagingDirectory)/vmsdevwebclient-app.zip'

        - task: AzureFileCopy@4
          displayName: Upload to Azure Storage
          inputs:
            SourcePath: '$(Build.ArtifactStagingDirectory)/vmsdevwebclient-app.zip'
            azureSubscription: $(azureSubscription)
            Destination: 'AzureBlob'
            storage: $(storageAccountName)
            ContainerName: $(containerName)
            CleanTargetBeforeCopy: true

- stage: Deploy
  displayName: Development
  dependsOn: Build
  condition: succeeded()
  jobs:
    - deployment: DeployApp
      displayName: Deploy to Development
      environment: Development
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self
                clean: true

              - task: AzureAppConfigurationExport@10
                displayName: Fetch Configuration from Azure App Config
                inputs:
                  azureSubscription: $(azureSubscription)
                  AppConfigurationEndpoint: $(DevAppConfigurationEndpoint)
                  KeyFilter: '*'

              - task: replacetokens@3
                displayName: Apply Configuration
                inputs:
                  rootDirectory: '$(System.DefaultWorkingDirectory)'
                  targetFiles: '**/environments/environment.ts'
                  encoding: 'auto'
                  writeBOM: true
                  actionOnMissing: 'fail'
                  keepToken: false
                  tokenPrefix: '#['
                  tokenSuffix: ']#'

              - task: AzureWebApp@1
                displayName: Deploy to Azure Web App
                inputs:
                  azureSubscription: $(azureSubscription)
                  appName: $(DevWebAppName)
                  package: 'https://$(storageAccountName).blob.core.windows.net/$(containerName)/angular/vmsdevwebclient-app.zip'

              - task: CmdLine@2
                displayName: Confirm Site is Up
                inputs:
                  script: |
                    sleep $(poll-time)
                    curl -sSf $(dev-url) > /dev/null
                  failOnStderr: true

              - task: PowerShell@2
                displayName: Rollback on Failure
                condition: failed()
                inputs:
                  targetType: 'inline'
                  script: |
                    Write-Host "Rolling back deployment..."
                    az webapp deployment source config-zip --resource-group MyResourceGroup --name $(DevWebAppName) --src https://$(storageAccountName).blob.core.windows.net/$(containerName)/angular/previous-vmsdevwebclient-app.zip
