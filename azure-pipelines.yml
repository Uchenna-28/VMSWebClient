trigger:
  branches:
    exclude:
      - main  # Prevents automatic build on merge to main

pr:
  branches:
    include:
      - '*'  # Ensures PRs are built before merging

parameters:
  - name: environment
    displayName: Which environment do you want to deploy to?
    type: string
    default: 'Development'
    values:
      - Development

variables:
  DevAppConfigurationEndpoint: 'https://dev-app-config.azconfig.io'
  azureSubscription: '722dfaac-093c-4648-b497-7114f90a8c3b'
  sonarcloudProjectKey: 'andersen-vms-ff564c1816d5b69e57'
  sonarcloudHost: 'https://sonarcloud.io/'
  SonarCloudToken: $(SonarCloudToken)
  storageAccountName: 'vmsdevfileserver'
  containerName: 'vmswebclient-deployemt-container'
  DevWebAppName: 'vms-dev-webclient'
  dev-url: 'https://$(DevWebAppName).azurewebsites.net'
  poll-time: 30s

stages:
- stage: Build
  displayName: Build Angular App
  jobs:
    - job: BuildApp
      displayName: Build
      pool:
        vmImage: ubuntu-latest
      steps:
        - checkout: self
          clean: true
          fetchDepth: "0"
          displayName: Checkout Code

        - script: |
            git gc --prune=all && git repack -a -f -F -d
          displayName: Cleanup Git History

        - task: NodeTool@0
          displayName: Install Node.js 22
          inputs:
            versionSpec: '22.x'
            checkLatest: true

        - script: npm ci
          displayName: Restore Dependencies

        - script: npm run build -- --configuration=production
          displayName: Build Angular App

        - script: mkdir -p $(Pipeline.Workspace)/drop
          displayName: Create Drop Folder

        - task: ArchiveFiles@2
          displayName: Archive Build Artifacts
          inputs:
            rootFolderOrFile: 'dist/vms-project-web'
            includeRootFolder: false
            archiveType: zip
            archiveFile: $(Build.ArtifactStagingDirectory)/vms-webapp.zip
            replaceExistingArchive: true

        - task: PublishBuildArtifacts@1
          displayName: Publish Build Artifact
          inputs:
            pathToPublish: $(Build.ArtifactStagingDirectory)/vms-webapp.zip
            artifactName: 'drop'

- stage: Deploy
  displayName: Deploy to Azure App Service
  dependsOn: []
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
    - deployment: DeployApp
      displayName: Deploy to Dev Environment
      environment: Development
      pool:
        vmImage: 'ubuntu-latest'
      strategy:
        runOnce:
          deploy:
            steps:
            - task: DownloadBuildArtifacts@0
              displayName: Download Build Artifact
              inputs:
                artifactName: 'drop'
                downloadPath: $(Pipeline.Workspace)/drop

            - script: ls -l $(Pipeline.Workspace)/drop
              displayName: Verify Downloaded Artifacts

            - task: AzureWebApp@1
              displayName: Deploy to Azure App Service
              inputs:
                azureSubscription: $(azureSubscription)
                appType: webAppLinux
                appName: $(DevWebAppName)
                runtimeStack: 'NODE|22LTS'
                package: $(Pipeline.Workspace)/drop/vms-webapp.zip
                startUpCommand: 'node server.js'

            - task: CmdLine@2
              displayName: Confirm Site is Up
              inputs:
                script: |
                  sleep 60 # Wait for deployment

                  url="https://$(DevWebAppName).azurewebsites.net"
                  echo "Checking if app is up at: $url"

                  for i in {1..5}; do
                    response=$(curl -s -o /dev/null -w "%{http_code}" "$url" -k)
                    if [ "$response" == "200" ]; then
                      echo "✅ App is up and running!"
                      exit 0
                    fi

                    echo "⏳ Attempt $i: App not yet available (HTTP $response), retrying in 10s..."
                    sleep 15
                  done

                  echo "❌ Deployment failed, app is not responding!"
                  exit 1
                failOnStderr: true
